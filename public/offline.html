<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Rome & Ride</title>
  <link rel="stylesheet" href="assets/css/custom.css">
  <style>
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .offline-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: #facc15;
      color: #000;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #facc15;
      color: #000000;
      font-weight: 700;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      box-sizing: border-box;
    }
    .hotline {
      margin-top: 20px;
      font-size: 13px;
      color: #71717a;
    }
    .hotline a {
      color: #facc15;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">Rome &amp; Ride</div>
    <h1>You are currently offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry, your cached app is still here. Check your connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="hotline">
      Emergency Roadside Assistance: <br>
      <a href="tel:+919876599999">+91 98765 99999</a>
    </div>
  </div>
</body>
</html>
